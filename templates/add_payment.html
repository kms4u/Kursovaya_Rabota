{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4 text-primary">
    <i class="bi bi-cash-stack"></i> Добавление платежа
</h2>

<form method="POST" class="card p-4 shadow-sm border-0">
    <div class="mb-3">
        <label for="child_id" class="form-label fw-bold">
            <i class="bi bi-person"></i> Ребенок *
        </label>
        <select name="child_id" id="child_id" class="form-select" required>
            <option value="">Выберите ребенка</option>
            {% for child in children %}
            <option value="{{ child.id }}">
                {{ child.full_name }} ({{ child.group.group_number if child.group else 'без группы' }})
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label for="amount" class="form-label fw-bold">
            <i class="bi bi-currency-ruble"></i> Сумма *
        </label>
        <div class="input-group">
            <input type="number"
                   step="0.01"
                   name="amount"
                   id="amount"
                   class="form-control"
                   placeholder="0.00"
                   required>
            <span class="input-group-text">₽</span>
        </div>
    </div>

    <div class="mb-3">
        <label for="period" class="form-label fw-bold">
            <i class="bi bi-calendar-week"></i> Период *
        </label>
        <input type="text"
               name="period"
               id="period"
               class="form-control"
               placeholder="2025-09"
               pattern="\d{4}-\d{2}"
               title="Формат: ГГГГ-ММ (например, 2025-09)"
               required>
        <small class="text-muted">Формат: ГГГГ-ММ (например, 2025-09)</small>
    </div>

    <hr class="my-3">

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-save"></i> Сохранить
        </button>
        <a href="/payments" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Отмена
        </a>
    </div>
</form>

{% endblock %}
