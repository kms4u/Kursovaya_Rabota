<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Детский сад - Информационная система</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
        }

        .navbar-nav .nav-link {
            transition: all 0.3s ease;
            margin: 0 5px;
        }

        .navbar-nav .nav-link:hover {
            transform: translateY(-2px);
            background-color: rgba(255,255,255,0.1);
            border-radius: 8px;
        }

        .container {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn {
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .table {
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }

        .table thead th {
            background-color: #2c3e50;
            color: white;
            font-weight: 600;
            border: none;
        }

        .table-hover tbody tr:hover {
            background-color: #f8f9fa;
            transition: all 0.3s ease;
        }

        .card {
            border-radius: 12px;
            overflow: hidden;
        }

        .form-control:focus, .form-select:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.25);
        }

        .btn-primary {
            background-color: #3498db;
            border-color: #3498db;
        }

        .btn-primary:hover {
            background-color: #2980b9;
            border-color: #2980b9;
        }

        .btn-outline-primary {
            border-color: #3498db;
            color: #3498db;
        }

        .btn-outline-primary:hover {
            background-color: #3498db;
            border-color: #3498db;
        }

        .btn-warning {
            background-color: #f39c12;
            border-color: #f39c12;
        }

        .btn-warning:hover {
            background-color: #e67e22;
            border-color: #e67e22;
        }

        .btn-danger {
            background-color: #e74c3c;
            border-color: #e74c3c;
        }

        .btn-danger:hover {
            background-color: #c0392b;
            border-color: #c0392b;
        }

        .badge.bg-primary {
            background-color: #3498db !important;
        }

        .badge.bg-success {
            background-color: #27ae60 !important;
        }

        .badge.bg-info {
            background-color: #3498db !important;
        }

        .badge.bg-warning {
            background-color: #f39c12 !important;
        }

        .badge.bg-danger {
            background-color: #e74c3c !important;
        }

        .badge.bg-dark {
            background-color: #2c3e50 !important;
        }
    </style>
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">

        <a class="navbar-brand" href="/">
            Детский сад
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/children">
                    <i class="bi bi-emoji-smile"></i> Дети
                </a>
                <a class="nav-link" href="/attendance">
                    <i class="bi bi-calendar-check"></i> Посещаемость
                </a>
                <a class="nav-link" href="/payments">
                    <i class="bi bi-cash-stack"></i> Платежи
                </a>
                <a class="nav-link" href="/parents">
                    <i class="bi bi-person-heart"></i> Родители
                </a>
                <a class="nav-link" href="/teachers">
                    <i class="bi bi-person-badge"></i> Воспитатели
                </a>
            </div>
        </div>

    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
